name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # 10,000 random runs through the real engine and rules on simulated rails.
      - run: pnpm check:sim
      # Offline checks of the recorded live runs; the chain comparison needs network and runs locally.
      - run: pnpm check:evidence
